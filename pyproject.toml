[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "causaldt_ad"
version = "0.1.0"
description = "Patient-centered causal digital twin of the amyloid-lysosomal loop for Alzheimer's disease"
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "torch>=2.1,<2.12",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pandas>=2.1",
    "msgspec>=0.18",
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["ruff", "black", "isort", "mypy", "pytest", "pre-commit"]

[project.scripts]
causaldt-ad = "causaldt_ad.headworks.__main__:main"

[tool.setuptools.packages.find]
include = ["causaldt_ad*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["causaldt_ad"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E741"]

[tool.ruff.lint.isort]
known-first-party = ["causaldt_ad"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["causaldt_ad"]
warn_return_any = false
disallow_untyped_calls = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["field_checks"]
addopts = "-q"
